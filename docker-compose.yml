# SmartPocket API.
#
# MySQL is NOT defined here — it already runs as its own container, shared with
# other apps on the box. Both services reach it through the host gateway rather
# than by joining its network: the MySQL container sits on the default `bridge`
# network, which gives no DNS, so a container name would not resolve. Its port
# is published on the host, and `host.docker.internal` maps there:
#
#   DATABASE_URL=mysql://smartpocket:secret@host.docker.internal:3306/smartpocket
#
# Config comes from `.env`, which is gitignored. Everything the server needs is
# documented in `.env.example`; JWT_SECRET, ALLOWED_ORIGINS and DATABASE_URL are
# mandatory — the server deliberately refuses to boot in production without them.
#
#   docker compose build
#   docker compose run --rm migrate     # once per deploy, before up
#   docker compose up -d
#
services:
  api:
    build:
      context: .
      target: runtime
    image: smartpocket-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned, and deliberately last so it wins over whatever PORT `.env`
      # carries — a dev `.env` here says 3001, which would leave the app
      # listening on a port neither the mapping below nor the healthcheck
      # knows about. Inside the container the port is always 3000; API_PORT
      # is the knob for the host side.
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound to loopback on purpose: TLS and the public origin are the reverse
    # proxy's job. The proxy MUST pass `X-Forwarded-Proto: https` — the session
    # cookie is only marked Secure when it sees that header
    # (server/_core/cookies.ts), and without it web sign-in breaks.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  # Applies committed migrations. Runs from the builder stage because
  # drizzle-kit is a devDependency and is not in the runtime image.
  #
  # `migrate` only — never `db:push`, which runs `drizzle-kit generate` first
  # and would author a brand new migration inside the container from whatever
  # the schema happens to say. Generating is a development step; its output
  # belongs in git.
  migrate:
    build:
      context: .
      target: builder
    image: smartpocket-migrate
    profiles: [tools]
    env_file: .env
    command: pnpm exec drizzle-kit migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
