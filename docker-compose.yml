# SmartPocket API.
#
# MySQL is NOT defined here — it already runs as its own container, shared with
# other apps on the box. Both services reach it through the host gateway rather
# than by joining its network: the MySQL container sits on the default `bridge`
# network, which gives no DNS, so a container name would not resolve. Its port
# is published on the host, and `host.docker.internal` maps there:
#
#   DATABASE_URL=mysql://smartpocket:secret@host.docker.internal:3306/smartpocket
#
# Config comes from `.env`, which is gitignored. Everything the server needs is
# documented in `.env.example`; JWT_SECRET, ALLOWED_ORIGINS and DATABASE_URL are
# mandatory — the server deliberately refuses to boot in production without them.
#
#   docker compose build
#   docker compose --profile tools run --rm migrate   # once per deploy, before up
#   docker compose up -d
#
# `--profile tools` is not optional on the migrate line. Without it compose
# still builds and runs the container, but hands it none of the env_file — so
# drizzle-kit dies on "DATABASE_URL is required" while `docker compose config`
# shows the variable resolving perfectly. Confirmed on compose v2.34.0.
#
services:
  api:
    build:
      context: .
      target: runtime
    image: smartpocket-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned, and deliberately last so it wins over whatever PORT `.env`
      # carries — a dev `.env` here says 3001, which would leave the app
      # listening on a port neither the mapping below nor the healthcheck
      # knows about. Inside the container the port is always 3000; API_PORT
      # is the knob for the host side.
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound to loopback on purpose: TLS and the public origin are the reverse
    # proxy's job. The proxy MUST pass `X-Forwarded-Proto: https` — the session
    # cookie is only marked Secure when it sees that header
    # (server/_core/cookies.ts), and without it web sign-in breaks.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  # Applies committed migrations. Runs from the builder stage because
  # drizzle-kit is a devDependency and is not in the runtime image.
  #
  # BOTH steps are required, in this order, and neither covers the other:
  #
  #   drizzle-kit migrate  applies everything registered in
  #                        drizzle/meta/_journal.json — 0000 through 0010.
  #   db:migrate:phase1    applies 0011-0015, which are deliberately absent
  #                        from that journal. They cannot be journal entries:
  #                        0012 drops the int id columns and must run *after*
  #                        the ULID backfill, which is application code, not
  #                        SQL. server/migrate-phase1.ts sequences
  #                        expand -> backfill -> verify -> contract -> sync
  #                        tables, and is idempotent, so re-running it on an
  #                        up-to-date database reports "already-applied" and
  #                        changes nothing.
  #
  # Running only the first leaves a database the app cannot query — every
  # synced table is missing deletedAt/dirty/serverSeq, and the first thing to
  # notice is the recurring-transaction cron failing with "Unknown column
  # 'deletedAt' in 'where clause'".
  #
  # `drizzle-kit migrate` only — never `db:push`, which runs `generate` first
  # and would author a brand new migration inside the container from whatever
  # the schema happens to say. Generating is a development step; its output
  # belongs in git.
  migrate:
    build:
      context: .
      target: builder
    image: smartpocket-migrate
    profiles: [tools]
    env_file: .env
    command: sh -c "pnpm exec drizzle-kit migrate && pnpm db:migrate:phase1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
